{% extends "base.html" %}

{% block title %}EventHub | Удаление события{% endblock %}

{% block content %}
<section class="page-shell">
    <div class="container">
        <div class="page-header">
            <span class="eyebrow">Удаление события</span>
            <h1>Удалить «{{ object.title }}»?</h1>
            <p>Событие будет скрыто из каталога и его страницы просмотра.</p>
        </div>
        <form method="post" class="event-card">
            {% csrf_token %}
            <button type="submit" class="btn">Удалить</button>
            <a href="{% url 'events:event_detail' object.pk %}" class="feature-link">Отмена</a>
        </form>
    </div>
</section>
{% endblock %}
