{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EventHub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <nav class="nav-shell">
        <div class="nav-wrapper container">
            <a href="{% url 'events:home' %}" class="brand-logo brand-mark">EventHub</a>
            <ul id="nav-mobile" class="right">
                <li><a href="{% url 'events:event_list' %}">Все события</a></li>
                <li><a href="{% url 'events:event_create' %}">Создать событие</a></li>
            </ul>
        </div> 
    </nav>
    <main>
        {% if messages %}
            <div class="container" aria-live="polite">
                {% for message in messages %}
                    <p class="{{ message.tags }}">{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
